; Lowstate on the little desk screen: ESP32-2432S028 ("Cheap Yellow Display"),
; ILI9341 320x240 on HSPI and an XPT2046 touch controller on its own pins.
; It reads and writes Lowstate's files in Google Drive like another computer.
;
;   node scripts/lowstate-gadget.cjs     (once: Google sign-in → include/secrets.h)
;   cd gadget && pio run -t upload

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = ota_partitions.csv
; Fonts are read from flash while drawing: read it at full speed.
board_build.f_flash = 80000000L
board_build.flash_mode = dio  ; this board's flash chip has no quad mode

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@^7.2.0
    lvgl/lvgl@8.4.0

build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -DARDUINOJSON_USE_LONG_LONG=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
