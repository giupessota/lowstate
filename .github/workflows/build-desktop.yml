name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: "dist:win"
            arch: "--x64"
            pattern: "dist/*.exe"
            artifact: "lowstate-windows-x64"
          - os: macos-latest
            script: "dist:mac"
            arch: "--x64"
            pattern: "dist/*-x64.dmg"
            artifact: "lowstate-macos-x64"
          - os: macos-latest
            script: "dist:mac"
            arch: "--arm64"
            pattern: "dist/*-arm64.dmg"
            artifact: "lowstate-macos-arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check and test
        run: npm run check
      - name: Build installer
        run: npm run ${{ matrix.script }} -- ${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.pattern }}
          generate_release_notes: true
