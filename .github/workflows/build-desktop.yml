name: Build desktop apps

# Roda ao criar uma tag "v..." (ex.: v1.0.1) ou manualmente pelo botão "Run workflow".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: "dist:win"
            pattern: "dist/*.exe"
          - os: macos-latest
            script: "dist:mac"
            pattern: "dist/*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          # Não assinar (build gratuito). Gera app não assinado.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Fica disponível pra baixar na aba Actions, em qualquer execução
      - uses: actions/upload-artifact@v4
        with:
          name: type-todo-${{ runner.os }}
          path: ${{ matrix.pattern }}
      # Ao criar uma tag "v...", anexa os instaladores numa Release
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.pattern }}
